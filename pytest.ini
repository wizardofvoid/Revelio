[pytest]
# Run from the project root:  python -m pytest
# (python -m puts the root on sys.path so `scanner` and `tests` both import.)
testpaths = tests
# The two "dead target" tests each make several real connections to a port
# where nothing listens; on Windows a dropped SYN takes ~2s to give up, so the
# suite is network-bound (~40s) despite everything else being sub-second.
